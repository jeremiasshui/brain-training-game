<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>紫垣命理｜紫微斗數個人命書</title>
<meta name="description" content="輸入出生年月日時，排出紫微斗數命盤並生成兩萬字以上的完整命書。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0c0d; --panel:#141415; --card:#1f1f22; --line:#2e2e33;
  --text:#f4f1ea; --body:#ddd6c8; --muted:#8d8a84; --dim:#5f5d59;
  --pink:#ff1f6b; --red:#ff5c6c; --green:#58c48a; --blue:#6fb1ff;
  --gold:#c9a961; --gold-deep:#6f5a2c; --wine:#2a1210;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:56px}
body{background:var(--bg);color:var(--text);font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;
  line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.narrow{max-width:480px}

.hero{background:radial-gradient(120% 80% at 50% 0%,#3a1a14 0%,var(--wine) 45%,var(--bg) 100%);padding:52px 0 40px;text-align:center}
.brand{letter-spacing:.5em;color:var(--gold);font-size:13px;padding-left:.5em}
.hero h1{font-size:36px;font-weight:900;line-height:1.3;margin:16px 0 12px;
  background:linear-gradient(180deg,#e9d39a,#8f733a);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#c9bfae;font-size:15px}

section{padding:36px 0}
h2{font-size:22px;font-weight:700;margin-bottom:6px}
.sub{color:var(--muted);font-size:14px;margin-bottom:20px}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:13px 14px;font-size:16px;outline:none;appearance:none;-webkit-appearance:none;color-scheme:dark}
.field input:focus,.field select:focus{border-color:var(--pink)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg label{margin:0;text-align:center;background:var(--card);border:1.5px solid var(--line);border-radius:12px;
  padding:12px;font-size:16px;color:var(--text);cursor:pointer}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg input:checked+label{border-color:var(--pink);color:var(--pink)}
.seg input:focus-visible+label{outline:2px solid var(--pink);outline-offset:2px}
.btn{display:block;width:100%;background:var(--pink);color:#fff;border-radius:16px;padding:16px;font-size:18px;
  font-weight:500;letter-spacing:.04em;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn.ghost{background:none;border:1.5px solid var(--line);color:var(--text);font-size:15px;padding:11px}
.err{color:var(--red);font-size:14px;min-height:22px;margin-bottom:6px}

#result{display:none}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--body)}
.chip b{color:var(--gold);font-weight:500}
.chart{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,minmax(118px,auto));gap:2px;
  background:var(--gold-deep);border:1px solid var(--gold-deep);border-radius:10px;overflow:hidden}
.cell{background:var(--panel);padding:5px 5px 34px;position:relative;min-width:0;display:block;text-decoration:none;color:inherit}
.cell:hover{background:#1a1a1c}
.cell.ming{background:#2a1320;box-shadow:inset 0 0 0 1.5px var(--pink)}
.ms{font-size:13.5px;line-height:1.35;color:#ecd9a6;font-weight:500;white-space:nowrap}
.ms small{font-size:9.5px;color:var(--muted);font-weight:400;margin-left:1px}
.none{color:var(--dim);font-size:11px}
.mn{font-size:10.5px;line-height:1.45;margin-top:3px;display:flex;flex-wrap:wrap;gap:0 5px}
.t吉{color:#9fc7ff}.t煞{color:#ff8f8f}.t桃花{color:#f6a3c6}.t孤{color:#9a968e}
.hua{display:inline-block;font-size:9.5px;line-height:1.25;border-radius:3px;padding:0 2px;margin-left:1px;color:#0c0c0d;font-weight:700}
.h祿{background:var(--green)}.h權{background:var(--red)}.h科{background:var(--blue)}.h忌{background:#b08cff}
.cell .pal{position:absolute;left:5px;bottom:4px;font-size:12px}
.cell.ming .pal{color:var(--pink);font-weight:700}
.cell .gz{position:absolute;right:5px;bottom:4px;font-size:10.5px;color:var(--dim)}
.cell .dec{position:absolute;left:5px;bottom:20px;font-size:9.5px;color:var(--dim)}
.cell .tag{font-size:9.5px;color:var(--pink);border:1px solid var(--pink);border-radius:3px;padding:0 2px;margin-left:3px}
.center{grid-column:2/4;grid-row:2/4;background:var(--bg);display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:10px;font-size:12.5px;color:#c9bfae;gap:3px}
.center strong{font-size:19px;color:var(--gold);font-weight:700}
.legend{font-size:11.5px;color:var(--muted);margin-top:10px;display:flex;flex-wrap:wrap;gap:4px 12px}

.bar{display:flex;gap:10px;margin:22px 0 6px;flex-wrap:wrap;align-items:center}
.bar .count{flex:1;min-width:180px;font-size:14px;color:var(--body)}
.bar .count b{color:var(--gold);font-size:20px}
.bar .btn{width:auto;padding:10px 18px}
.toc{position:sticky;top:0;z-index:5;background:rgba(12,12,13,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
  margin:16px -20px 0;padding:10px 20px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.toc::-webkit-scrollbar{display:none}
.toc a{flex:none;font-size:13px;color:var(--body);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:3px 12px}
.toc a:hover,.toc a:focus-visible{border-color:var(--gold);color:var(--gold);outline:none}
.report article{padding:30px 0 6px;border-bottom:1px solid #1c1c1e}
.report h3{font-size:22px;color:var(--gold);margin-bottom:12px;font-weight:700}
.report h3 span{font-size:12px;color:var(--dim);font-weight:400;margin-right:8px;letter-spacing:.1em}
.report h4{font-size:16px;color:var(--text);margin:20px 0 6px;font-weight:700;border-left:3px solid var(--gold-deep);padding-left:10px}
.report p{font-size:15.5px;color:var(--body);margin-bottom:10px;text-align:justify}
.report .starsline{font-size:13px;color:var(--muted);background:var(--card);border-radius:10px;padding:8px 12px;text-align:left}
.now{font-size:11px;font-weight:400;color:var(--pink);border:1px solid var(--pink);border-radius:4px;padding:0 5px;margin-left:8px;white-space:nowrap}
footer{padding:28px 0 60px;color:var(--dim);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
@media (max-width:420px){.ms{font-size:12.5px}.mn{font-size:10px}}
@media print{
  :root{--bg:#fff;--panel:#fff;--card:#f3f1ec;--line:#ccc;--text:#111;--body:#222;--muted:#555;--dim:#777;--gold:#7a5a12;--gold-deep:#b9a26a}
  body{background:#fff}.hero,#start,.toc,.bar .btn,footer{display:none!important}
  .cell.ming{background:#fbeaf0}.center{background:#fff}.ms{color:#5a3f00}
  .report article{break-inside:auto}.report h3,.report h4{break-after:avoid}
  .chart{break-inside:avoid}
}
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="brand">紫垣命理</div>
    <h1>知命，<br>是為了好好選擇</h1>
    <p>紫微斗數個人命書｜十四主星 × 輔星雜曜 × 四化飛星 × 大限流年</p>
  </div>
</header>

<main>
<section id="start">
  <div class="wrap narrow">
    <h2>排一張命盤</h2>
    <p class="sub">輸入國曆生日與出生時辰，即時生成兩萬字以上的完整命書。資料只在你的瀏覽器內計算，不會上傳。</p>
    <form id="form" novalidate>
      <div class="field">
        <label for="name">稱呼</label>
        <input id="name" autocomplete="nickname" maxlength="20" placeholder="怎麼稱呼（可留空）">
      </div>
      <div class="field">
        <label>性別（決定大限順逆）</label>
        <div class="seg">
          <input type="radio" name="gender" id="gf" value="女" checked><label for="gf">女</label>
          <input type="radio" name="gender" id="gm" value="男"><label for="gm">男</label>
        </div>
      </div>
      <div class="field">
        <label for="birth">出生日期（國曆）</label>
        <input id="birth" type="date" min="1920-01-01" max="2099-12-31" required>
      </div>
      <div class="field">
        <label for="hour">出生時辰</label>
        <select id="hour" required></select>
      </div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn" type="submit">排盤並生成命書</button>
    </form>
  </div>
</section>

<section id="result">
  <div class="wrap">
    <h2 id="resTitle">紫微命盤</h2>
    <p class="sub" id="resSub"></p>
    <div class="meta" id="meta"></div>
    <div class="chart" id="chart"></div>
    <div class="legend">
      <span><span class="hua h祿">祿</span> <span class="hua h權">權</span> <span class="hua h科">科</span> <span class="hua h忌">忌</span> 生年四化</span>
      <span class="t吉">吉星</span><span class="t煞">煞星</span><span class="t桃花">桃花星</span><span class="t孤">孤性雜曜</span>
      <span>主星右側小字為廟旺利陷</span><span>點宮位可跳到該宮解讀</span>
    </div>
    <div class="bar">
      <div class="count">本命書共 <b id="count">0</b> 字</div>
      <button class="btn ghost" id="print" type="button">列印／存成 PDF</button>
    </div>
    <nav class="toc" id="toc" aria-label="命書目錄"></nav>
    <div class="report" id="report"></div>
  </div>
</section>
</main>

<footer><div class="wrap">命理內容僅供自我探索與參考，不構成醫療、法律或投資建議。</div></footer>

<script src="data-main-a.js"></script>
<script src="data-main-b.js"></script>
<script src="data-main-c.js"></script>
<script src="data-misc.js"></script>
<script src="engine.js"></script>
<script src="report.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HOURS=['23:00–00:59','01:00–02:59','03:00–04:59','05:00–06:59','07:00–08:59','09:00–10:59',
             '11:00–12:59','13:00–14:59','15:00–16:59','17:00–18:59','19:00–20:59','21:00–22:59'];
const NUM='〇一二三四五六', GRID=[5,6,7,8, 4,-1,9, 3,10, 2,1,0,11];   // 巳午未申／辰‧酉／卯‧戌／寅丑子亥
$('hour').innerHTML='<option value="">請選擇</option>'+HOURS.map((h,i)=>`<option value="${i}">${ZW.BR[i]}時（${h}）</option>`).join('');

const KEY='ziyuan.last';
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s){$('name').value=s.name||'';$('birth').value=s.birth||'';$('hour').value=s.hour??'';if(s.gender==='男')$('gm').checked=true}}catch(_){}

$('form').addEventListener('submit',e=>{
  e.preventDefault();
  const v=$('birth').value,h=$('hour').value,gender=document.querySelector('[name=gender]:checked').value,name=$('name').value.trim();
  if(!v){$('err').textContent='請選擇出生日期';return}
  if(h===''){$('err').textContent='請選擇出生時辰';return}
  const [y,m,d]=v.split('-').map(Number);
  if(y<1920||y>2099){$('err').textContent='請輸入 1920–2099 年之間的日期';return}
  let c;try{c=ZW.buildChart(y,m,d,+h,gender)}catch(_){$('err').textContent='此瀏覽器無法換算農曆，請改用新版 Chrome 或 Safari';return}
  $('err').textContent='';
  try{localStorage.setItem(KEY,JSON.stringify({name,birth:v,hour:h,gender}))}catch(_){}
  render(c,{name,gender,y,m,d,h:+h});
});

function render(c,p){
  const who=p.name?esc(p.name):'';
  $('resTitle').innerHTML=(who?who+' 的':'')+'紫微命盤';
  $('resSub').textContent=`國曆 ${p.y} 年 ${p.m} 月 ${p.d} 日 ${ZW.BR[p.h]}時｜${p.gender}`;
  const ju=c.element+NUM[c.ju]+'局';
  $('meta').innerHTML=[['農曆',`${c.yearGZ}年 ${c.lunar.leap?'閏':''}${c.lunar.month}月${c.lunar.day}日`],['生肖',c.zodiac],['五行局',ju],
    ['命宮',ZW.BR[c.ming]],['身宮',ZW.BR[c.shen]],['命主',c.mingZhu],['身主',c.shenZhu],
    ['四化',ZW.HUA_NAMES.map(h=>c.hua[h]+h).join(' ')]].map(([k,v])=>`<span class="chip">${k} <b>${v}</b></span>`).join('');
  const hua=s=>s.hua?`<span class="hua h${s.hua}">${s.hua}</span>`:'';
  $('chart').innerHTML=GRID.map(i=>{
    if(i<0) return `<div class="center"><strong>${who||'命主'}</strong><span>${c.yearGZ}年生・屬${c.zodiac}・${c.yang?'陽':'陰'}${c.gender}</span><span>${ju}・大限${c.dir>0?'順':'逆'}行</span><span>命主${c.mingZhu}・身主${c.shenZhu}</span></div>`;
    const x=c.cells[i];
    return `<a class="cell${x.isMing?' ming':''}" href="#pal${x.p}" aria-label="${x.palace}，${x.main.map(s=>s.name).join('、')||'無主星'}">
      ${x.main.map(s=>`<div class="ms">${s.name}<small>${s.bright}</small>${hua(s)}</div>`).join('')||'<div class="none">無主星</div>'}
      <div class="mn">${x.minor.map(s=>`<span class="t${ZW.MINOR[s.name].t}">${s.name}${hua(s)}</span>`).join('')}</div>
      <span class="dec">${x.decade[0]}–${x.decade[1]}</span>
      <span class="pal">${x.palace}${x.isShen?'<span class="tag">身</span>':''}</span><span class="gz">${x.stem}${x.branch}</span></a>`;
  }).join('');
  const r=ZW.buildReport(c,who,new Date().getFullYear());
  $('count').textContent=r.count.toLocaleString('en-US');
  $('toc').innerHTML=r.secs.map(s=>`<a href="#${s.id}">${s.title}</a>`).join('');
  $('report').innerHTML=r.secs.map((s,n)=>`<article id="${s.id}"><h3><span>${String(n+1).padStart(2,'0')}</span>${s.title}</h3>${s.html}</article>`).join('');
  $('result').style.display='block';
  $('result').scrollIntoView({behavior:'smooth',block:'start'});
}
$('print').onclick=()=>window.print();
</script>
</body>
</html>
